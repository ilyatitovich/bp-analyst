name: Release stores

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-stores-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: Zip and submit Edge + Firefox
    runs-on: ubuntu-latest
    environment: stores
    defaults:
      run:
        working-directory: apps/extension
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Assert tag matches package version
        working-directory: .
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./apps/extension/package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag version ($TAG) does not match apps/extension/package.json version ($PKG)"
            exit 1
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Zip Edge
        run: pnpm zip

      - name: Zip Firefox
        run: pnpm zip:firefox

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: store-packages-${{ github.ref_name }}
          path: |
            apps/extension/.output/beatport-analyst-*-edge.zip
            apps/extension/.output/beatport-analyst-*-firefox.zip
            apps/extension/.output/beatport-analyst-*-sources.zip
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/extension/.output/beatport-analyst-*-edge.zip
            apps/extension/.output/beatport-analyst-*-firefox.zip
            apps/extension/.output/beatport-analyst-*-sources.zip
          generate_release_notes: true

      - name: Submit to Edge and Firefox stores
        run: pnpm submit:stores
        env:
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
