name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @bp-analyst/extension typecheck

      - name: Lint
        run: pnpm --filter @bp-analyst/extension lint

      - name: Format
        run: pnpm format:check

      - name: Dead code
        run: pnpm --filter @bp-analyst/extension knip

      - name: Test
        run: pnpm --filter @bp-analyst/extension test

      - name: Build Chrome
        run: pnpm --filter @bp-analyst/extension build:chrome

      - name: Build Edge
        run: pnpm --filter @bp-analyst/extension build

      - name: Build Firefox
        run: pnpm --filter @bp-analyst/extension build:firefox

      - name: Install Playwright Chromium
        run: pnpm --filter @bp-analyst/extension exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm --filter @bp-analyst/extension test:e2e
